<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/verbose-funicular/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bissnes promotion</title>
    <script type="module" crossorigin src="/verbose-funicular/index.js"></script>
    <link rel="stylesheet" crossorigin href="/verbose-funicular/assets/styles-8ri-YCKN.css">
  </head>
  <body>
    <header class="header">
  <div class="container header-container">
    <nav class="navigation">
      <a class="nav-logo" href="./index.html">
        <img src="../img/logo.png" alt="logo" />
        Product
      </a>
      <ul class="header-list">
        <li class="header-list-item">
          <a href="./index.html" class="header-list-link active">Product</a>
        </li>
        <li class="header-list-item">
          <a href="./pricing.html" class="header-list-link">Pricing</a>
        </li>
        <li class="header-list-item">
          <a href="./customer.html" class="header-list-link">Customers</a>
        </li>
        <li class="header-list-item">
          <a href="" class="header-list-link">Resources</a>
        </li>
      </ul>
    </nav>
    <ul class="header-list-btn">
      <li class="header-list-btn-item">
        <button type="button" class="list-btn-sign">Sign in</button>
      </li>
      <li class="header-list-btn-item">
        <button type="button" class="list-btn-signup">Sign up</button>
      </li>
    </ul>
    <button type="button" class="mobile-header-btn">
      <svg width="28" height="32">
        <use href="./images/symbols.svg#icon-menu"></use>
      </svg>
    </button>
  </div>
</header>


    <main>
      <!-- Loads the specified .html file -->
      <section class="vite-promo">
  <div class="container">
    <div class="vite-promo-thumb">
      <a
        class="vite-promo-link"
        href="https://vitejs.dev/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Link to Vite official website"
        title="Vite.js  build tool"
      >
        <!-- Path to images as from index.html file -->
        <img
          class="pic"
          src="/verbose-funicular/assets/vite-logo-9o_aqrTe.png"
          alt="Vite logo"
          width="640"
          height="640"
        />
      </a>
    </div>
    <h1 class="main-title">
      <span class="main-title-gradient">Vite</span>
      Template by
      <a
        class="main-title-link"
        href="https://github.com/goitacademy/vanilla-app-template"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT
      </a>
    </h1>
  </div>
</section>

      <article class="badges">
  <div class="container">
    <ul class="badges-list">
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-html-inject"
          target="_blank"
          rel="noopener noreferrer"
        >
          HTML Inject
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/vite-plugin-full-reload"
          target="_blank"
          rel="noopener noreferrer"
        >
          Full Reload
        </a>
      </li>
      <li class="badges-item">
        <a
          class="badges-link"
          href="https://www.npmjs.com/package/postcss-sort-media-queries"
          target="_blank"
          rel="noopener noreferrer"
        >
          Sort Media Queries
        </a>
      </li>
    </ul>
  </div>
</article>

    </main>

    <footer class="footer">
  <div class="container">
    <p class="footer-desc">
      Made with ✨ by
      <a
        class="footer-link"
        href="https://goit.global/ua/"
        target="_blank"
        rel="noopener noreferrer"
      >
        GoIT team
      </a>
    </p>
  </div>
</footer>


  </body>
</html>
